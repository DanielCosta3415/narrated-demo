name: Windows validation
on:
  workflow_dispatch:
  push:
    paths: ['app/**', 'installer/**', 'tests/**', 'plugins/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  isolated-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: powershell
        run: ./installer/Install.ps1 -AcceptDownloads -Destination "$env:RUNNER_TEMP/NarratedDemo/runtime"
      - name: Unit tests and audiovisual fixture
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP/NarratedDemo/runtime/venv/Scripts/python.exe" plugins/narrated-demo/skills/narrated-demo/scripts/test_pipeline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/NarratedDemo/runtime/venv/Scripts/python.exe" tests/self_test.py "$env:RUNNER_TEMP/NarratedDemo/runtime/runtime.json" "$env:RUNNER_TEMP/NarratedDemo/output"
          exit $LASTEXITCODE
